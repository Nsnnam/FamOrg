# FamOrg on Synology NAS
#
# IMPORTANT: This stack uses network_mode: host because Docker bridge NAT on many
# Synology units cannot reach the public Internet (weather / FX / Gemini / Telegram
# all fail with "fetch failed"). Host network shares the NAS IP stack (proven OK).
#
# Ports (host):
#   LOCAL_PORT  (default 3000) — app HTTP LAN
#   PUBLIC_PORT (default 8443) — nginx HTTPS public
#   127.0.0.1:8080             — Watchtower HTTP API (localhost only)

services:
  family-organizer:
    # Prebuilt multi-arch image from GHCR (CI on main). Override via IMAGE=...
    image: ${IMAGE:-ghcr.io/your-github-user/famorg:latest}
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        GIT_SHA: ${GIT_SHA:-}
        APP_VERSION: ${APP_VERSION:-}
        BUILD_TIME: ${BUILD_TIME:-}
    container_name: famorg_app
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      # Listen on LAN port directly (host network — no port publish)
      - PORT=${LOCAL_PORT:-3000}
      - TZ=Asia/Ho_Chi_Minh
      # Prefer IPv4 when host has broken IPv6 routes
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      # Watchtower is published on host loopback (see watchtower.ports)
      - WATCHTOWER_URL=http://127.0.0.1:8080
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN:-}
      - GITHUB_REPO=${GITHUB_REPO:-your-github-user/FamOrg}
    labels:
      - "com.centurylinklabs.watchtower.enable=${WATCHTOWER_ENABLE:-false}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Host network: listens PUBLIC_PORT (8443) TLS → app LOCAL_PORT (3000)
  nginx:
    image: nginx:1.27-alpine
    container_name: famorg_nginx
    restart: unless-stopped
    network_mode: host
    depends_on:
      - family-organizer
    environment:
      - LOCAL_PORT=${LOCAL_PORT:-3000}
      - PUBLIC_PORT=${PUBLIC_PORT:-8443}
      - SERVER_NAME=${SERVER_NAME:-_}
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/certs:ro
    # nginx official image runs envsubst on /etc/nginx/templates → conf.d
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # Only localhost — used by family-organizer on host network
      - "127.0.0.1:8080:8080"
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=86400
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN:-}
      - DOCKER_API_VERSION=1.40
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
